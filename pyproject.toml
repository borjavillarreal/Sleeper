[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "MCP server exposing the Sleeper fantasy football API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
sleeper-mcp = "sleeper_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["sleeper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
